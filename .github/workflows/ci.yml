name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SONAR_ORGANIZATION: jurahein
  SONAR_PROJECT_KEY: jurahein_aws-lambda-springboot-api

jobs:
  build-and-sonar:
    name: Build, testes e SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # o Sonar precisa do historico completo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, testes e analise Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          AWS_REGION: us-east-1
          AWS_DEPLOY_ROLE_ARN: arn:aws:iam::360734035729:role/github-actions-lambda-deploy
          LAMBDA_FUNCTION_NAME: aws-lambda-springboot-api-dev          
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="jurahein" \
            -Dsonar.projectKey="jurahein"

      - name: Guardar o pacote do Lambda
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: target/aws-lambda-springboot-api.jar
          if-no-files-found: error

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  secrets-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Revisao de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4


  deploy:
    name: Deploy no Lambda
    needs: [build-and-sonar, codeql, secrets-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lambda-package

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publicar codigo no Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://aws-lambda-springboot-api.jar
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Smoke test
        run: |
          API_URL=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='${LAMBDA_FUNCTION_NAME}-http'].ApiEndpoint | [0]" \
            --output text)
          echo "API: $API_URL"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$API_URL/health" || true)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1      